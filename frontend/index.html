<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI TREND — 발간 콘솔</title>
<style>
  :root{
    --ink:#1C2B45;        /* 잉크 네이비 */
    --paper:#EEF1F4;      /* 서늘한 종이색 배경 */
    --card:#FFFFFF;
    --line:#C9D2DC;
    --muted:#5B6B80;
    --run:#B7791F;        /* 실행 중 앰버 */
    --done:#2F6B4F;       /* 완료 그린 */
    --console-bg:#16243B; /* 로그 콘솔 */
    --console-fg:#DCE6F2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:0 16px 48px;
  }

  /* 발간물 표지풍 마스트헤드: 이중 괘선 */
  header{
    width:100%; max-width:860px;
    margin-top:40px; padding:20px 4px 14px;
    border-top:3px solid var(--ink);
    border-bottom:1px solid var(--ink);
    position:relative;
  }
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:3px;
    border-bottom:1px solid var(--ink);
  }
  .masthead{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  h1{font-size:1.45rem; letter-spacing:.02em; font-weight:800;}
  h1 small{font-weight:500; color:var(--muted); font-size:.85rem; margin-left:10px;}
  #status{
    font-size:.8rem; font-weight:700; padding:4px 12px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); background:var(--card);
  }
  #status.running{color:var(--run); border-color:var(--run);}
  #status.done{color:var(--done); border-color:var(--done);}

  main{width:100%; max-width:860px; margin-top:22px; display:flex; flex-direction:column; gap:18px;}

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px;
  }
  .panel h2{font-size:.82rem; font-weight:700; color:var(--muted); letter-spacing:.08em; margin-bottom:12px;}

  #runBtn{
    font:inherit; font-weight:700; font-size:1rem;
    color:#fff; background:var(--ink);
    border:none; border-radius:8px; padding:12px 26px; cursor:pointer;
  }
  #runBtn:hover{background:#25395C;}
  #runBtn:disabled{background:#9AA7B8; cursor:not-allowed;}
  .hint{font-size:.83rem; color:var(--muted); margin-top:10px; line-height:1.6;}

  #console{
    background:var(--console-bg); color:var(--console-fg);
    border-radius:10px; border:1px solid var(--ink);
    height:420px; overflow-y:auto;
    padding:14px 16px;
    font-family:"SF Mono",Consolas,"Nanum Gothic Coding",monospace;
    font-size:.82rem; line-height:1.65;
  }
  #console .stage{font-weight:700;}
  #console .s-orchestrator{color:#9BB8E8;}
  #console .s-researcher{color:#8FD3B6;}
  #console .s-editor{color:#F2C97D;}
  #console .s-writer{color:#E8A9A1;}
  #console .s-reviewer{color:#C7A9E8;}
  #console .empty{color:#5F7396;}

  @media (prefers-reduced-motion: no-preference){
    #status.running{animation:pulse 1.6s ease-in-out infinite;}
    @keyframes pulse{50%{opacity:.55;}}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <h1>『AI TREND』 발간 콘솔<small>해외 AI 정책·기술 동향 — 파일럿</small></h1>
    <span id="status">대기</span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>명령</h2>
    <button id="runBtn">발간 실행</button>
    <p class="hint">
      조사자 → 편집장 → 작가 → 검토자 순서로 파이프라인이 실행됩니다.
      완료 후 원고와 검토 로그를 확인한 뒤 발송 여부를 직접 결정하세요. (자동 발송 없음)
    </p>
  </section>

  <section class="panel">
    <h2>에이전트 활동 로그</h2>
    <div id="console"><div class="empty">아직 실행 기록이 없습니다. [발간 실행]을 누르면 로그가 여기에 흐릅니다.</div></div>
  </section>
</main>

<script>
  const btn = document.getElementById('runBtn');
  const box = document.getElementById('console');
  const status = document.getElementById('status');
  let firstLine = true;

  function addLine(text){
    if (firstLine){ box.innerHTML = ''; firstLine = false; }
    const [stage, ...rest] = text.split(' | ');
    const div = document.createElement('div');
    const s = document.createElement('span');
    s.className = 'stage s-' + stage.trim();
    s.textContent = stage.trim();
    div.appendChild(s);
    div.appendChild(document.createTextNode('  ' + rest.join(' | ')));
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(mode, label){
    status.className = mode; status.textContent = label;
  }

  // 서버의 로그 스트림(SSE)에 상시 연결 — 실행이 시작되면 로그가 흘러들어온다
  const es = new EventSource('/events');
  es.onmessage = (e) => addLine(e.data);
  es.addEventListener('end', () => {
    setStatus('done', '완료');
    btn.disabled = false;
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    setStatus('running', '실행 중');
    const res = await fetch('/run', {method:'POST'});
    if (res.status === 409){
      addLine('orchestrator | 이미 실행 중입니다. 완료를 기다려 주세요.');
    }
  });
</script>

</body>
</html>
